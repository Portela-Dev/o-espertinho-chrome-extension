name: CI e pacote da extensão

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      sonar:
        description: Executar SonarQube nesta branch
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Validar e empacotar extensão
    # Chromium sandbox stays enabled; Ubuntu 24 AppArmor restricts downloaded browsers.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Auditar dependências
        run: npm audit --audit-level=high
      - name: Validar e testar o pacote
        run: npm run check
      - name: Preparar Chromium para teste da extensão
        run: npx --no-install playwright install --with-deps chromium
      - name: Validar quatro etapas em Chromium real
        run: npm run test:native
      - name: Publicar cobertura dos testes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_id }}
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Gerar pacote para instalação local
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'http://localhost:3000' }}
        run: npm run package
      - name: Disponibilizar extensão e instruções
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: o-espertinho-chrome-extension-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30
      - name: Registrar instruções no resumo
        run: |
          {
            echo '### O Espertinho — extensão Chrome'
            echo 'Baixe o artefato desta execução. Ele contém o ZIP da extensão, SHA256SUMS e INSTALAR.txt.'
            echo 'Extraia o pacote e carregue a pasta com manifest.json em chrome://extensions, no modo de desenvolvedor.'
            echo 'Este workflow não executa deploy nem publica na Chrome Web Store.'
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: SonarQube e Quality Gate (opcional)
    needs: build
    if: vars.SONAR_ENABLED == 'true' && ((github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && inputs.sonar))
    runs-on: [self-hosted, Windows, X64, windows-portela-dev]
    timeout-minutes: 15
    concurrency:
      group: sonar-${{ github.repository }}-develop
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baixar cobertura do mesmo commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports-${{ github.run_id }}
          path: reports/coverage
      - name: Conferir configuração e preparar verificação do scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'reports/coverage/lcov.info')) { throw 'Cobertura do commit ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'Configure SONAR_TOKEN nos secrets.' }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) { throw 'Configure SONAR_HOST_URL nas variables.' }
          if (-not (Get-Command gpg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command dirmngr.exe -ErrorAction SilentlyContinue)) {
            $git = Get-Command git.exe -ErrorAction Stop
            $gitTools = Join-Path (Split-Path -Parent (Split-Path -Parent $git.Source)) 'usr/bin'
            foreach ($tool in @('gpg.exe', 'dirmngr.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $gitTools $tool))) { throw "Ferramenta ausente: $tool" }
            }
            [IO.File]::AppendAllText($env:GITHUB_PATH, $gitTools + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          }
      - name: Analisar e aguardar Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Detalhar resultado do Quality Gate
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = ((Get-Content sonar-project.properties | Select-String '^sonar.projectKey=').Line -split '=', 2)[1]
          $headers = @{ Authorization = 'Bearer ' + $env:SONAR_TOKEN; 'ngrok-skip-browser-warning' = 'true' }
          $base = $env:SONAR_HOST_URL.TrimEnd('/')
          $gate = Invoke-RestMethod -Uri ($base + '/api/qualitygates/project_status?projectKey=' + $key) -Headers $headers -TimeoutSec 30
          $gate.projectStatus | ConvertTo-Json -Depth 5
          $issues = Invoke-RestMethod -Uri ($base + '/api/issues/search?componentKeys=' + $key + '&resolved=false&inNewCodePeriod=true&ps=100') -Headers $headers -TimeoutSec 30
          $issues.issues | Select-Object rule,component,line,message | ConvertTo-Json -Depth 5
